    锈不是颜色，<br>是别的器物在叫我。
    <cite>游戏内台词</cite>
  </blockquote>
  <div class="gloss">
    <p><b>青铜上的绿，多数是保护层</b> —— 赤铜矿与孔雀石一类致密锈层，封住金属基体，
      器物才躺得住三千年。绿色本身不是坏消息。</p>
    <p><b>长成浅绿粉末的那层才是病</b>：<em>青铜病</em>（俗称青铜癌），氯离子参与的活性腐蚀，
      产物是浅绿粉末状的氯铜矿，遇湿就扩展，能在器物之间「传染」，一路把铜吃掉。
      「癌」只是比喻 —— 它不可逆、会蔓延。游戏里锈从坑壁爬上来，讲的就是它；
      拟人化成敌人是再创作，完整表述见 <code>docs/GAMEPLAY.md</code>。</p>
